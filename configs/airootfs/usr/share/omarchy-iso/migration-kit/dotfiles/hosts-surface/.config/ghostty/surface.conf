# Surface Laptop 4 overrides. Included from the main Ghostty config by one appended line, `config-file = ?surface.conf` (path is relative to that file; loaded last, so these values win).
# The prefixed form keeps the mouse wheel at Ghostty's default (3) and lets the touchpad be tuned by itself.
# Start at 1 (the default), then try 0.5 and 0.25 until scrolling feels right. Untested on this laptop.
mouse-scroll-multiplier = precision:1,discrete:3
